name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          # PR: check commits on the branch vs its base. Push: check commits in the pushed range.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/$GITHUB_BASE_REF...HEAD"
          elif [ "$GITHUB_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$GITHUB_BEFORE..HEAD"
          else
            RANGE="--max-count=1"
          fi
          git log --format='%s' $RANGE > /tmp/commits.txt
          fail=0
          while IFS= read -r subject; do
            case "$subject" in
              Merge*|Revert*|"") continue ;;
            esac
            if ! printf '%s' "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|security|revert)(\([a-z0-9-]+\))?!?: .+'; then
              echo "::error::Commit message does not follow Conventional Commits: $subject"
              fail=1
            fi
          done < /tmp/commits.txt
          exit $fail

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run predeploy
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
